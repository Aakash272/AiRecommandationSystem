spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      database: formpilot_ai_db

  cloud:
    function:
      definition: activityProcessor
    stream:
      kafka:
        binder:
          brokers: localhost:9092
          auto-create-topics: true
      bindings:
        activityProcessor-in-0:
          destination: fitness-topic
          content-type: application/json

